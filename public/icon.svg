<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120e" />
      <stop offset="50%" stop-color="#050806" />
      <stop offset="100%" stop-color="#020302" />
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#27272a" stroke-width="2" opacity="0.6" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#limeGlow)" stroke-width="1.5" opacity="0.25" />

  <!-- Candlestick Graphic Silhouette in Background -->
  <g opacity="0.18">
    <line x1="120" y1="180" x2="120" y2="340" stroke="#a3e635" stroke-width="3" />
    <rect x="110" y="210" width="20" height="90" rx="3" fill="#a3e635" />
    <line x1="390" y1="160" x2="390" y2="330" stroke="#a3e635" stroke-width="3" />
    <rect x="380" y="190" width="20" height="100" rx="3" fill="#a3e635" />
  </g>

  <!-- Central "TX" Emblem -->
  <g transform="translate(256, 256)" text-anchor="middle" dominant-baseline="central">
    <!-- Trend upward pulse -->
    <path d="M -150 70 L -70 20 L 10 -40 L 90 -20 L 150 -100" fill="none" stroke="url(#limeGlow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Bold T shape with neon accent -->
    <path d="M -130 -110 L -30 -110 L -30 -85 L -65 -85 L -65 60 L -95 60 L -95 -85 L -130 -85 Z" fill="#ffffff" />
    
    <!-- Bold X shape crossing with neon gradient -->
    <path d="M 20 -110 L 60 -110 L 95 -50 L 130 -110 L 170 -110 L 115 -25 L 172 60 L 132 60 L 95 -2 L 58 60 L 18 60 L 75 -25 Z" fill="url(#limeGlow)" filter="url(#neonBlur)" />
  </g>

  <!-- Green dynamic trading dot -->
  <circle cx="410" cy="156" r="10" fill="#a3e635" filter="url(#neonBlur)" />
</svg>
